name: Deploy

# Deploys main to both hosts. Each SSH key is restricted on its server to a forced
# command (git pull + scripts/deploy-vps.sh), so it cannot open a shell:
#   deploy       -> VPS_*  (103.116.39.111, /usr/local/bin/muse-deploy)
#   deploy-inmu  -> INMU_* (198.58.105.211, inmu.vn91.net, /usr/local/bin/inmu-deploy)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes "$VPS_USER@$VPS_HOST" deploy

  deploy-inmu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-inmu
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          INMU_SSH_KEY: ${{ secrets.INMU_SSH_KEY }}
          INMU_KNOWN_HOSTS: ${{ secrets.INMU_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$INMU_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$INMU_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy to inmu.vn91.net
        env:
          INMU_HOST: ${{ secrets.INMU_HOST }}
          INMU_USER: ${{ secrets.INMU_USER }}
        run: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes "$INMU_USER@$INMU_HOST" /usr/local/bin/inmu-deploy
